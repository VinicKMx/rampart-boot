name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            gcc-arm-none-eabi \
            libssl-dev \
            ninja-build

      - name: Check C formatting
        run: |
          find core platform stage0 stage1 tests -type f \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure host
        run: cmake --preset host-debug

      - name: Build host
        run: cmake --build --preset host-debug

      - name: Test host
        run: ctest --preset host-debug

      - name: Configure clang-tidy
        run: cmake --preset host-tidy

      - name: Build clang-tidy
        run: cmake --build --preset host-tidy

      - name: Configure sanitizers
        run: cmake --preset host-sanitize

      - name: Build sanitizers
        run: cmake --build --preset host-sanitize

      - name: Test sanitizers
        run: ctest --preset host-sanitize

      - name: Configure parser fuzzing
        run: cmake --preset host-fuzz

      - name: Build parser fuzzing
        run: cmake --build --preset host-fuzz

      - name: Test parser fuzzing
        run: ctest --preset host-fuzz

      - name: Configure STM32U585
        run: cmake --preset stm32u585

      - name: Build STM32U585
        run: cmake --build --preset stm32u585

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Verify canonical v1 artifact
        run: cargo run --quiet -p rampart -- image verify tests/vectors/image-v1/valid.rampart
